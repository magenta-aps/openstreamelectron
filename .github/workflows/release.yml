name: Build AppImages

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScreenConnector
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ScreenConnector/package-lock.json

      # Electron ships ~120 MB of prebuilt binaries per architecture
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('ScreenConnector/package-lock.json') }}

      - run: npm ci

      - name: Build AppImages
        run: |
          # On a tag, the version comes from the tag rather than package.json
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXTRA="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"
          fi
          npx electron-builder --linux AppImage --x64 --arm64 --publish never $EXTRA
          ls -lh dist/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: appimages
          path: ScreenConnector/dist/*.AppImage

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Filenames carry no version, so /releases/latest/download/<name>
          # resolves across releases; pin a build with the tag in the URL instead
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/ScreenConnector-x86_64.AppImage \
            dist/ScreenConnector-arm64.AppImage
